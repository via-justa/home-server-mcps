name: Release

# Publishes the packages plugin repos build and test against: the plugin SDK, and core (for its
# plugin harness, `@synoikia/core/testing`). A package is published when its package.json version
# isn't on npm yet, so a release is a version bump merged to main. Prereleases (`0.3.0-rc.0`) are
# published by hand only, under the `next` dist-tag, so `latest` never moves to one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing, and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @synoikia/plugin-sdk --filter @synoikia/core build
      - name: Publish new versions
        env:
          # No token: npm authenticates through trusted publishing (this repo and release.yml, with
          # direct publishing allowed, on each package's npmjs.com settings). Empty, not unset, so the
          # placeholder setup-node writes into .npmrc can't stand in for a token.
          NODE_AUTH_TOKEN: ''
          # npm only accepts provenance from public source repositories.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          # A refused trusted publish only says ENEEDAUTH or E403; the reason is logged at verbose.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          # SDK first: core's published dependency on it must resolve.
          for dir in packages/plugin-sdk packages/core; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            tag=latest
            if [[ "$version" == *-* ]]; then
              if [[ "$MANUAL" != true ]]; then
                echo "$name@$version is a prerelease: publish it by hand (Run workflow)"
                continue
              fi
              tag=next
            fi
            # pnpm pack rewrites workspace: ranges to real versions.
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/pack" | tail -n 1)
            npm publish "$tarball" --access public --tag "$tag" --provenance="$PROVENANCE"
          done

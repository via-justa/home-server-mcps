[project]
name = "media-apps-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "via-justa", email = "25720282+via-justa@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
media-apps-mcp = "media_apps_mcp:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
